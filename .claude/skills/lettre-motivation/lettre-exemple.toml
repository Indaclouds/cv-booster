  "Ce que j'apporte : deux ou trois besoins de l'offre, chacun relié à une expérience réelle, chiffrée.",
  "Pourquoi cette entreprise ou ce poste, en deux phrases.",
  "Proposition d'échange, simple.",
]

formule = "Je vous prie d'agréer, Madame, Monsieur, mes salutations distinguées."
